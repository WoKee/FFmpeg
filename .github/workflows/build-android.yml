name: Build Android FFmpeg .so

on:
  push:
    branches:
      - release-9.0-fongmi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
            triple: aarch64-linux-android
            api: 24
          - arch: armv7a
            abi: armeabi-v7a
            triple: armv7a-linux-androideabi
            api: 24
          - arch: x86_64
            abi: x86_64
            triple: x86_64-linux-android
            api: 24
          - arch: i686
            abi: x86
            triple: i686-linux-android
            api: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug environment
        run: |
          echo "=== Android env vars ==="
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== Find NDK ==="
          find / -name "ndk-build" -type f 2>/dev/null | head -5
          ls -la /usr/local/lib/android/ 2>/dev/null || echo "no /usr/local/lib/android"
          ls -la /usr/lib/android* 2>/dev/null || echo "no /usr/lib/android"
          echo "=== env | grep -i android ==="
          env | grep -i android || echo "no android env vars"
          echo "=== Done ==="

      - name: Install NDK
        run: |
          set -ex
          # Try to find pre-installed NDK
          FOUND_NDK=""
          for path in "$ANDROID_NDK_HOME" "$ANDROID_NDK_ROOT" "$ANDROID_HOME/ndk-bundle" "$ANDROID_SDK_ROOT/ndk-bundle"; do
            if [ -n "$path" ] && [ -d "$path/toolchains/llvm/prebuilt/linux-x86_64" ]; then
              FOUND_NDK="$path"
              break
            fi
          done

          if [ -z "$FOUND_NDK" ]; then
            # Search common locations
            for base in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android/sdk "$HOME/android-sdk"; do
              if [ -d "$base/ndk" ]; then
                FOUND_NDK=$(ls -d "$base/ndk"/*/ 2>/dev/null | sort -V | tail -1)
                FOUND_NDK="${FOUND_NDK%/}"
                break
              fi
            done
          fi

          if [ -z "$FOUND_NDK" ]; then
            echo "=== No pre-installed NDK found, downloading NDK r27c ==="
            wget -q "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -O /tmp/ndk.zip
            mkdir -p /opt/android
            unzip -q /tmp/ndk.zip -d /opt/android
            FOUND_NDK="/opt/android/android-ndk-r27c"
            rm /tmp/ndk.zip
          fi

          echo "FOUND_NDK=$FOUND_NDK"
          echo "FOUND_NDK=$FOUND_NDK" >> $GITHUB_ENV
          ls "$FOUND_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -10

      - name: Configure and Build FFmpeg for ${{ matrix.abi }}
        run: |
          set -ex
          NDK="$FOUND_NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"

          CC="${{ matrix.triple }}${{ matrix.api }}-clang"
          CXX="${{ matrix.triple }}${{ matrix.api }}-clang++"

          echo "=== Compiler check ==="
          which $CC && $CC --version

          ./configure \
            --target-os=android \
            --arch=${{ matrix.arch }} \
            --cross-prefix="${{ matrix.triple }}-" \
            --cc="$CC" \
            --cxx="$CXX" \
            --ar=llvm-ar \
            --as=llvm-as \
            --ld=lld \
            --ranlib=llvm-ranlib \
            --strip=llvm-strip \
            --nm=llvm-nm \
            --enable-cross-compile \
            --sysroot="$TOOLCHAIN/sysroot" \
            --enable-shared \
            --disable-static \
            --enable-small \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-symver \
            --disable-stripping \
            --disable-asm \
            --enable-threads \
            --prefix="$(pwd)/build/${{ matrix.abi }}"

          make -j$(nproc)
          make install
          ls -la "$(pwd)/build/${{ matrix.abi }}/lib/"

      - name: Upload ${{ matrix.abi }} .so files
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/lib/*.so
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output

      - name: Package into zip
        run: |
          cd output
          zip -r ../ffmpeg-android-libs.zip .
          cd ..

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-libs
          path: ffmpeg-android-libs.zip
          if-no-files-found: error

name: Build Android FFmpeg .so

on:
  push:
    branches:
      - release-9.0-fongmi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
            triple: aarch64-linux-android
            api: 24
          - arch: armv7a
            abi: armeabi-v7a
            triple: armv7a-linux-androideabi
            api: 24
          - arch: x86_64
            abi: x86_64
            triple: x86_64-linux-android
            api: 24
          - arch: i686
            abi: x86
            triple: i686-linux-android
            api: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK and Build FFmpeg for ${{ matrix.abi }}
        run: |
          set -ex

          # Find or download NDK
          NDK=""
          for p in "$ANDROID_NDK_HOME" "$ANDROID_NDK_ROOT"; do
            if [ -n "$p" ] && [ -d "$p/toolchains/llvm/prebuilt/linux-x86_64" ]; then
              NDK="$p"; break
            fi
          done
          if [ -z "$NDK" ]; then
            for base in /usr/local/lib/android/sdk /opt/android-sdk; do
              if [ -d "$base/ndk" ]; then
                NDK=$(find "$base/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
                [ -n "$NDK" ] && break
              fi
            done
          fi
          if [ -z "$NDK" ]; then
            wget -q "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -O /tmp/ndk.zip
            mkdir -p /opt/android
            unzip -q /tmp/ndk.zip -d /opt/android
            NDK="/opt/android/android-ndk-r27c"
            rm /tmp/ndk.zip
          fi

          echo "NDK path: $NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TC/bin:$PATH"

          CC="${{ matrix.triple }}${{ matrix.api }}-clang"
          echo "Compiler: $CC"
          which $CC
          $CC --version

          # Build configure args
          CONFIGURE_ARGS="
            --target-os=android
            --arch=${{ matrix.arch }}
            --cross-prefix=${{ matrix.triple }}-
            --cc=$CC
            --cxx=${{ matrix.triple }}${{ matrix.api }}-clang++
            --ar=llvm-ar
            --as=llvm-as
            --ld=lld
            --ranlib=llvm-ranlib
            --strip=llvm-strip
            --nm=llvm-nm
            --enable-cross-compile
            --enable-shared
            --disable-static
            --enable-small
            --disable-programs
            --disable-doc
            --disable-debug
            --disable-symver
            --disable-stripping
            --disable-asm
            --enable-threads
            --prefix=$(pwd)/build/${{ matrix.abi }}
          "

          # Add sysroot if the directory exists
          if [ -d "$TC/sysroot" ]; then
            CONFIGURE_ARGS="$CONFIGURE_ARGS --sysroot=$TC/sysroot"
            echo "Using sysroot: $TC/sysroot"
          else
            echo "No sysroot dir at $TC/sysroot, skipping --sysroot"
          fi

          # Convert to array and run
          ./configure $CONFIGURE_ARGS

          make -j$(nproc)
          make install
          ls -la "$(pwd)/build/${{ matrix.abi }}/lib/"

      - name: Upload ${{ matrix.abi }} .so files
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/lib/*.so
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output

      - name: Package into zip
        run: |
          cd output
          zip -r ../ffmpeg-android-libs.zip .
          cd ..

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-libs
          path: ffmpeg-android-libs.zip
          if-no-files-found: error

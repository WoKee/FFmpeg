name: Build Android FFmpeg .so

on:
  push:
    branches:
      - release-9.0-fongmi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
            triple: aarch64-linux-android
          - arch: armv7a
            abi: armeabi-v7a
            triple: armv7a-linux-androideabi
          - arch: x86_64
            abi: x86_64
            triple: x86_64-linux-android
          - arch: i686
            abi: x86
            triple: i686-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          set -ex

          # Download NDK if needed
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          else
            wget -q "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -O /tmp/n.zip
            unzip -q /tmp/n.zip -d /opt
            NDK="/opt/android-ndk-r27c"
          fi
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          CC=${{ matrix.triple }}24-clang
          CXX=${{ matrix.triple }}24-clang++

          ./configure \
            --target-os=android \
            --arch=${{ matrix.arch }} \
            --cross-prefix=${{ matrix.triple }}- \
            --cc=$CC \
            --cxx=$CXX \
            --ar=llvm-ar \
            --as=llvm-as \
            --ld=lld \
            --ranlib=llvm-ranlib \
            --strip=llvm-strip \
            --nm=llvm-nm \
            --enable-cross-compile \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-doc \
            --disable-asm \
            --disable-symver \
            --disable-stripping \
            --prefix=$(pwd)/out/${{ matrix.abi }} \
            > /tmp/configure.log 2>&1 || { echo "CONFIGURE FAILED"; cat /tmp/configure.log | tail -80; exit 1; }

          echo "=== Configure done, starting make ==="
          make -j$(nproc) > /tmp/make.log 2>&1 || { echo "MAKE FAILED"; tail -80 /tmp/make.log; exit 1; }

          make install
          echo "=== Build complete ==="
          ls -la out/${{ matrix.abi }}/lib/

      - name: Upload ${{ matrix.abi }}
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/lib/*.so
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all
        uses: actions/download-artifact@v4
        with:
          path: output
      - name: Zip
        run: cd output && zip -r ../ffmpeg-android.zip . && cd ..
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-libs
          path: ffmpeg-android.zip
          if-no-files-found: error

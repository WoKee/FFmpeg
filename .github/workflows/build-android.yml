name: Build Android FFmpeg .so

on:
  push:
    branches:
      - release-9.0-fongmi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
            triple: aarch64-linux-android
            api: 24
          - arch: armv7a
            abi: armeabi-v7a
            triple: armv7a-linux-androideabi
            api: 24
          - arch: x86_64
            abi: x86_64
            triple: x86_64-linux-android
            api: 24
          - arch: i686
            abi: x86
            triple: i686-linux-android
            api: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure and Build FFmpeg for ${{ matrix.abi }}
        run: |
          set -ex

          # Find NDK on GitHub runner
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK="$ANDROID_NDK_ROOT"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK=$(ls -d "$ANDROID_HOME/ndk"/*/ 2>/dev/null | sort -V | tail -1)
            NDK="${NDK%/}"
          else
            echo "ERROR: NDK not found"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls -la /usr/local/lib/android/ 2>/dev/null || true
            ls -la $ANDROID_HOME/ndk/ 2>/dev/null || true
            exit 1
          fi

          echo "=== NDK: $NDK ==="
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "=== TOOLCHAIN: $TOOLCHAIN ==="
          ls "$TOOLCHAIN/bin/" | grep -i "${{ matrix.triple }}" | head -10

          export PATH="$TOOLCHAIN/bin:$PATH"

          CC="${{ matrix.triple }}${{ matrix.api }}-clang"
          CXX="${{ matrix.triple }}${{ matrix.api }}-clang++"

          echo "=== Testing compiler ==="
          which $CC
          $CC --version

          # Configure
          ./configure \
            --target-os=android \
            --arch=${{ matrix.arch }} \
            --cross-prefix="${{ matrix.triple }}-" \
            --cc="$CC" \
            --cxx="$CXX" \
            --ar=llvm-ar \
            --as=llvm-as \
            --ld=lld \
            --ranlib=llvm-ranlib \
            --strip=llvm-strip \
            --nm=llvm-nm \
            --enable-cross-compile \
            --sysroot="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            --enable-shared \
            --disable-static \
            --enable-small \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-symver \
            --disable-stripping \
            --disable-asm \
            --enable-threads \
            --enable-mediacodec \
            --enable-jni \
            --prefix="$(pwd)/build/${{ matrix.abi }}"

          echo "=== Configure done, building ==="
          make -j$(nproc)
          echo "=== Build done, installing ==="
          make install

          echo "=== Output .so files ==="
          ls -la "$(pwd)/build/${{ matrix.abi }}/lib/"

      - name: Upload ${{ matrix.abi }} .so files
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/lib/*.so
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output

      - name: Package into zip
        run: |
          cd output
          zip -r ../ffmpeg-android-libs.zip .
          cd ..

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-libs
          path: ffmpeg-android-libs.zip
          if-no-files-found: error
